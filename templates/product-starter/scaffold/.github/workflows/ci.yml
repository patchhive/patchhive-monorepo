name: __PRODUCT_TITLE__ CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check backend
        run: |
          cargo fmt --check
          cargo check --locked
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install frontend dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            if [ -f package-lock.json ]; then npm ci --prefer-online && exit 0; else npm install --prefer-online && exit 0; fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "npm install failed, retrying after registry backoff..."
            sleep 15
          done

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - context: .
            file: backend/Dockerfile
          - context: .
            file: frontend/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.file }}
          push: false
