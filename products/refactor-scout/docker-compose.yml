services:
  backend:
    image: "${PATCHHIVE_REFACTOR_SCOUT_BACKEND_IMAGE:-ghcr.io/patchhive/refactorscout-backend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: docker/backend-product.Dockerfile
      args: { PRODUCT_SLUG: refactor-scout, BINARY_NAME: refactor-scout }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    user: "${PATCHHIVE_BACKEND_UID:-10001}:${PATCHHIVE_BACKEND_GID:-10001}"
    ports:
      - "8090:8000"
    volumes:
      - ./data:/data
    environment:
      - REFACTOR_SCOUT_DB_PATH=/data/refactor-scout.db
      - REFACTOR_SCOUT_PORT=8000
      - RUST_LOG=info
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: "${PATCHHIVE_REFACTOR_SCOUT_FRONTEND_IMAGE:-ghcr.io/patchhive/refactorscout-frontend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: products/refactor-scout/frontend/Dockerfile
      args: { VITE_API_URL: "http://127.0.0.1:8090" }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    ports:
      - "5182:8080"
    depends_on:
      - backend
    restart: unless-stopped
