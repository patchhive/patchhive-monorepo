services:
  backend:
    image: "${PATCHHIVE_REPO_MEMORY_BACKEND_IMAGE:-ghcr.io/patchhive/repomemory-backend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: docker/backend-product.Dockerfile
      args: { PRODUCT_SLUG: repo-memory, BINARY_NAME: repo-memory }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    user: "${PATCHHIVE_BACKEND_UID:-10001}:${PATCHHIVE_BACKEND_GID:-10001}"
    ports:
      - "8030:8000"
    volumes:
      - ./data:/data
    environment:
      - REPO_MEMORY_DB_PATH=/data/repo-memory.db
      - REPO_MEMORY_PORT=8000
      - RUST_LOG=info
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: "${PATCHHIVE_REPO_MEMORY_FRONTEND_IMAGE:-ghcr.io/patchhive/repomemory-frontend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: products/repo-memory/frontend/Dockerfile
      args: { VITE_API_URL: "http://127.0.0.1:8030" }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    ports:
      - "5176:8080"
    depends_on:
      - backend
    restart: unless-stopped
