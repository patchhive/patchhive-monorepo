services:
  backend:
    image: "${PATCHHIVE_FLAKE_STING_BACKEND_IMAGE:-ghcr.io/patchhive/flakesting-backend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: docker/backend-product.Dockerfile
      args: { PRODUCT_SLUG: flake-sting, BINARY_NAME: flake-sting }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    user: "${PATCHHIVE_BACKEND_UID:-10001}:${PATCHHIVE_BACKEND_GID:-10001}"
    ports:
      - "8060:8000"
    volumes:
      - ./data:/data
    environment:
      - FLAKE_STING_DB_PATH=/data/flake-sting.db
      - FLAKE_STING_PORT=8000
      - RUST_LOG=info
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: "${PATCHHIVE_FLAKE_STING_FRONTEND_IMAGE:-ghcr.io/patchhive/flakesting-frontend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: products/flake-sting/frontend/Dockerfile
      args: { VITE_API_URL: "http://127.0.0.1:8060" }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    ports:
      - "5179:8080"
    depends_on:
      - backend
    restart: unless-stopped
