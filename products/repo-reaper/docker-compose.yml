services:
  backend:
    image: "${PATCHHIVE_REPO_REAPER_BACKEND_IMAGE:-ghcr.io/patchhive/reporeaper-backend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: docker/backend-product.Dockerfile
      args: { PRODUCT_SLUG: repo-reaper, BINARY_NAME: repo-reaper }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    user: "${PATCHHIVE_BACKEND_UID:-10001}:${PATCHHIVE_BACKEND_GID:-10001}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - REAPER_DB_PATH=/data/repo-reaper.db
      - REAPER_WORK_DIR=/tmp/repo-reaper
      - REAPER_PORT=8000
      - RUST_LOG=info
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: "${PATCHHIVE_REPO_REAPER_FRONTEND_IMAGE:-ghcr.io/patchhive/reporeaper-frontend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: products/repo-reaper/frontend/Dockerfile
      args: { VITE_API_URL: "http://127.0.0.1:8000" }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    ports:
      - "5173:8080"
    depends_on:
      - backend
    restart: unless-stopped
