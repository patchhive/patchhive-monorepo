services:
  backend:
    image: "${PATCHHIVE_SIGNAL_HIVE_BACKEND_IMAGE:-ghcr.io/patchhive/signalhive-backend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: docker/backend-product.Dockerfile
      args: { PRODUCT_SLUG: signal-hive, BINARY_NAME: signal-hive }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    user: "${PATCHHIVE_BACKEND_UID:-10001}:${PATCHHIVE_BACKEND_GID:-10001}"
    ports:
      - "8010:8000"
    volumes:
      - ./data:/data
    environment:
      - SIGNAL_DB_PATH=/data/signal-hive.db
      - SIGNAL_PORT=8000
      - RUST_LOG=info
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: "${PATCHHIVE_SIGNAL_HIVE_FRONTEND_IMAGE:-ghcr.io/patchhive/signalhive-frontend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: products/signal-hive/frontend/Dockerfile
      args: { VITE_API_URL: "http://127.0.0.1:8010" }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    ports:
      - "5174:8080"
    depends_on:
      - backend
    restart: unless-stopped
