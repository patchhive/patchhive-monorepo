services:
  backend:
    image: "${PATCHHIVE_TRUST_GATE_BACKEND_IMAGE:-ghcr.io/patchhive/trustgate-backend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: docker/backend-product.Dockerfile
      args: { PRODUCT_SLUG: trust-gate, BINARY_NAME: trust-gate }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    user: "${PATCHHIVE_BACKEND_UID:-10001}:${PATCHHIVE_BACKEND_GID:-10001}"
    ports:
      - "8020:8000"
    volumes:
      - ./data:/data
    environment:
      - TRUST_DB_PATH=/data/trust-gate.db
      - TRUSTGATE_PORT=8000
      - RUST_LOG=info
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: "${PATCHHIVE_TRUST_GATE_FRONTEND_IMAGE:-ghcr.io/patchhive/trustgate-frontend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: products/trust-gate/frontend/Dockerfile
      args: { VITE_API_URL: "http://127.0.0.1:8020" }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    ports:
      - "5175:8080"
    depends_on:
      - backend
    restart: unless-stopped
