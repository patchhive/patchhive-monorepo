services:
  backend:
    image: "${PATCHHIVE_MERGE_KEEPER_BACKEND_IMAGE:-ghcr.io/patchhive/mergekeeper-backend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: docker/backend-product.Dockerfile
      args: { PRODUCT_SLUG: merge-keeper, BINARY_NAME: merge-keeper }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    user: "${PATCHHIVE_BACKEND_UID:-10001}:${PATCHHIVE_BACKEND_GID:-10001}"
    ports:
      - "8050:8000"
    volumes:
      - ./data:/data
    environment:
      - MERGE_KEEPER_DB_PATH=/data/merge-keeper.db
      - MERGE_KEEPER_PORT=8000
      - RUST_LOG=info
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: "${PATCHHIVE_MERGE_KEEPER_FRONTEND_IMAGE:-ghcr.io/patchhive/mergekeeper-frontend}:${PATCHHIVE_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: products/merge-keeper/frontend/Dockerfile
      args: { VITE_API_URL: "http://127.0.0.1:8050" }
    pull_policy: "${PATCHHIVE_IMAGE_PULL_POLICY:-missing}"
    ports:
      - "5178:8080"
    depends_on:
      - backend
    restart: unless-stopped
