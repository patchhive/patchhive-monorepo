name: patchhive-ai-local CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-gateway:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify Node entrypoint
        run: node --check src/cli.js

      - name: Verify adapters
        run: |
          node --test test/*.test.js
          node --check adapters/codex/auth.js
          node --check adapters/codex/index.js
          node --check adapters/copilot/index.js

  rust-gateway:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust-gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Test Rust gateway
        run: cargo test --locked

      - name: Lint Rust gateway
        run: cargo clippy --all-targets --locked -- -D warnings
