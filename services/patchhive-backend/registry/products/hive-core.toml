key = "hive-core"
code = "HC"
name = "HiveCore"
role = "control plane and suite cockpit"
module_path = "hive_core"
route_prefix = "/api/products/hive-core"

[display]
order = 0
icon = "⬢"
lane = "Control Plane"
description = "Runs suite discovery, governed work handoffs, policy, approvals, outcomes, and operator controls."
repository = "patchhive/hivecore"
frontend_url = "http://localhost:5183"
api_url = "http://localhost:8100"

[safety]
read_only = false
writes_external_state = false
requires_operator_approval = true
credential_scopes = ["suite:control", "products:configure"]
evidence_required = ["operator session", "capability dispatch log"]

[health]
endpoint = "/api/products/hive-core/health"
timeout_ms = 2000
healthy_status = 200

[[capabilities]]
id = "suite-status"
label = "Suite status"
description = "Read suite health, product status, and runtime mode."

[[capabilities]]
id = "product-registry"
label = "Product registry"
description = "Read product manifests, claimed routes, and capabilities."

[[capabilities]]
id = "run-index"
label = "Run index"
description = "Read suite-wide run summaries and event history."

[[capabilities]]
id = "governed-conductor"
label = "Governed conductor"
description = "Dispatch admitted discovery and advance durable work through resource, smoke, pause, and approval gates."

[[capabilities]]
id = "suite-governance"
label = "Suite governance"
description = "Manage durable pause authority, resource admission, smoke autonomy, PR outcomes, and reputation slowdown."

[[capabilities]]
id = "declarative-pipelines"
label = "Declarative pipelines"
description = "Execute guarded ordered suite runs from TOML with bounded result expressions."

[[capabilities]]
id = "work-outcome-ledger"
label = "Work and outcome ledger"
description = "Correlate product findings, handoffs, dispatches, pull requests, outcomes, and live blast radius."

[[capabilities]]
id = "maintainer-engagements"
label = "Maintainer engagements"
description = "Verify, classify, pause, and route messages on Tendwright-owned GitHub artifacts."

[[routes]]
method = "GET"
path = "/api/products"
description = "List registered PatchHive products."

[[routes]]
method = "GET"
path = "/api/runs"
description = "List suite-wide run summaries."

[[routes]]
method = "GET"
path = "/api/events"
description = "List suite-wide events."

[[routes]]
method = "GET"
path = "/api/products/hive-core/governance"
description = "Read topology, pause, smoke, resource, rate, and reputation evidence."

[[routes]]
method = "PUT"
path = "/api/products/hive-core/governance/resources"
description = "Configure durable resource-admission ceilings."

[[routes]]
method = "POST"
path = "/api/products/hive-core/governance/pause"
description = "Pause new suite, product, mandate, or repository work."

[[routes]]
method = "POST"
path = "/api/products/hive-core/governance/resume"
description = "Resume one exact paused scope."

[[routes]]
method = "GET"
path = "/api/products/hive-core/work-items"
description = "List durable deduplicated work items."

[[routes]]
method = "POST"
path = "/api/products/hive-core/work-items/proposals"
description = "Record one concrete work proposal."

[[routes]]
method = "GET"
path = "/api/products/hive-core/work-items/findings"
description = "List idempotent product-finding receipts."

[[routes]]
method = "POST"
path = "/api/products/hive-core/work-items/findings"
description = "Ingest idempotent product-finding receipts."

[[routes]]
method = "GET"
path = "/api/products/hive-core/work-items/:id"
description = "Read one work item and its source receipts."

[[routes]]
method = "GET"
path = "/api/products/hive-core/events"
description = "Read the unified HiveCore work and outcome ledger."

[[routes]]
method = "GET"
path = "/api/products/hive-core/engagements"
description = "Read the durable maintainer-engagement inbox."

[[routes]]
method = "POST"
path = "/api/products/hive-core/engagements/artifacts"
description = "Register product ownership of a GitHub issue or pull request."

[[routes]]
method = "POST"
path = "/api/products/hive-core/engagements/:id/decision"
description = "Record an operator decision or propose an exact guarded response handoff."

[[routes]]
method = "POST"
path = "/api/products/hive-core/webhooks/github/engagements"
description = "Ingest signed GitHub maintainer messages on owned artifacts."

[[routes]]
method = "GET"
path = "/api/products/hive-core/blast-radius/:slug"
description = "Read work-ledger-derived product impact."

[[routes]]
method = "GET"
path = "/api/products/hive-core/conductor/ticks"
description = "Read durable conductor decisions."

[[routes]]
method = "POST"
path = "/api/products/hive-core/conductor/ticks"
description = "Run one admitted discovery and work-handoff tick."

[[routes]]
method = "GET"
path = "/api/products/hive-core/suite-runs"
description = "Read ordered suite-run history."

[[routes]]
method = "POST"
path = "/api/products/hive-core/suite-runs"
description = "Execute one guarded ordered suite run."

[[routes]]
method = "POST"
path = "/api/products/hive-core/pipelines/execute"
description = "Execute a guarded declarative TOML pipeline."
